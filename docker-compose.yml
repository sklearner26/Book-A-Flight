version: '3.8'

services:
  book-a-flight:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book-a-flight-app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - .:/app
      - /app/__pycache__
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - book-a-flight-network

networks:
  book-a-flight-network:
    driver: bridge